apiVersion: v1
kind: ConfigMap
metadata:
  name: site-intelligence-config
data:
  SITE_INTELLIGENCE_ROOT: /app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-intelligence-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: site-intelligence-api
  template:
    metadata:
      labels:
        app: site-intelligence-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/OWNER/REPOSITORY:VERSION
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: site-intelligence-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: site-intelligence-api
spec:
  selector:
    app: site-intelligence-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: site-intelligence-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: site-intelligence-api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65

