apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: site-intelligence-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: site-intelligence-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-intelligence-api
spec:
  podSelector:
    matchLabels:
      app: site-intelligence-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53

