name: Refresh uv lockfile

on:
  push:
    branches:
      - security/codeql-v4-20260830
    paths:
      - .github/workflows/refresh-uv-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/codeql-v4-20260830
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - name: Refresh lockfile
        run: uv lock
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "chore: refresh uv lockfile"
            git push origin HEAD:security/codeql-v4-20260830
          fi
