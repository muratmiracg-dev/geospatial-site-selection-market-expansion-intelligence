services:
  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: site_intelligence
      POSTGRES_USER: site_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./sql/views.sql:/docker-entrypoint-initdb.d/20-views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site_user -d site_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [backend]

  api:
    build:
      context: .
    environment:
      SITE_INTELLIGENCE_ROOT: /app
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend, observability]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [api]
    networks: [observability]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local_only_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [observability]

networks:
  backend:
    internal: true
  observability: {}

volumes:
  postgis_data: {}

